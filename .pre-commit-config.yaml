# Fleet: mcp-central-docs/templates/pre-commit-config.yaml.template
# Copy to {repo}/.pre-commit-config.yaml
# Setup: just bootstrap  (uv sync dev deps + pre-commit install + webapp npm ci)
# Also copy scripts/pre-commit-biome.ps1 from templates/pre-commit-biome.ps1 when webapp/ or web_sota/ exists.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
        # Optional: scope Python paths, e.g. files: ^(src/|tests/)
      - id: ruff-format

  - repo: local
    hooks:
      - id: ps1-ascii-fix
        name: powershell confusables to ASCII (autofix)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-ascii-fix.ps1
        language: system
        # Runs BEFORE ps1-ascii-only: rewrites em/en dashes, smart quotes,
        # ellipsis and nbsp to ASCII in place, then exits 1 so the commit
        # aborts and the fix gets re-staged. Anything outside that map still
        # fails ps1-ascii-only below on purpose. Vendor copy of
        # mcp-central-docs/templates/pre-commit-ascii-fix.ps1 - keep in sync.
        files: \.(ps1|psm1|psd1)$
        require_serial: true

      - id: biome-web
        name: biome check (webapp)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        files: ^(webapp(/frontend)?|web_sota|web)/(.*\.(ts|tsx|js|jsx)|biome\.json)$
        pass_filenames: false
        require_serial: true

      - id: ps1-ascii-only
        name: powershell files must be ASCII (PS 5.1 reads BOM-less as ANSI)
        # Any non-ASCII byte fails; a leading UTF-8 BOM is allowed. pygrep
        # matches raw bytes per line, so \A is line start (BOM = line 1).
        entry: '[\x80-\xff](?<!\A\xef)(?<!\A\xef\xbb)(?<!\A\xef\xbb\xbf)'
        language: pygrep
        files: \.(ps1|psm1|psd1)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]
